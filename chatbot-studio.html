<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>챗봇 스튜디오 · 연결 안내</title>
  <link rel="icon" href="assets/images/common/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/admin.css">
  <script src="assets/js/studio-entry.js?v=20261028" defer></script>
</head>
<body class="login-body">
  <main class="login-card">
    <span class="eyebrow">TOURISM CONTENT ARCHIVE</span>
    <h1>챗봇 스튜디오</h1>
    <p>안내 콘텐츠를 편집하고, 미리보고, 게시하는 관리 공간입니다.</p>
    <section class="demo-account" aria-labelledby="studio-connection-title">
      <strong id="studio-connection-title">관리 서버 연결 확인</strong>
      <p data-studio-status role="status" aria-live="polite">로그인 화면을 연결하고 있습니다.</p>
    </section>
    <p>관리자 로그인과 게시 기능은 관리 서버에서 실행됩니다. GitHub Pages는 정적 페이지 호스팅으로, 이 서버 기능을 실행하지 않습니다.</p>
    <div data-studio-local hidden>
      <p>로컬 관리 서버를 실행한 뒤 다시 연결해 주세요.</p>
      <pre><code>python server/server.py --port 8000</code></pre>
      <p><a href="http://127.0.0.1:8000/admin/login">로컬 챗봇 스튜디오 열기 ↗</a></p>
    </div>
    <noscript><p>로컬에서는 관리 서버를 실행한 뒤 http://127.0.0.1:8000/admin/login 에서 로그인할 수 있습니다.</p></noscript>
    <a class="quiet-link" href="index.html">← 포트폴리오 홈으로 돌아가기</a>
  </main>
</body>
</html>
